# The current car, how we build it, and this season's build milestones.
# No spec sheet on purpose: the site tells the build story instead.
# Milestones mark themselves Done / Up next / Upcoming from the date — never edit status by hand.
season: 2025–26
name: The 2025–26 car
photo: /images/car-current.jpg
summary: Every season we start from a clean sheet. Each car is designed, analyzed, machined, and welded by students, then pushed to its limits in testing before it ever reaches a competition.
subsystems:
  - name: Chassis
    description: A steel tube frame and driver cell built around safety and stiffness, with lightweight composite body panels and a seat shaped around the driver.
  - name: Suspension
    description: Long-travel suspension tuned to soak up rocks, logs, and hard landings while keeping the tires planted.
  - name: Powertrain
    description: An in-house drivetrain that turns engine power into traction, from the CVT through a custom gearbox to the wheels.
  - name: Controls and electronics
    description: Electronics, sensors, and data acquisition that help us tune the car and validate every design in the dirt.
  - name: Manufacturing
    description: In-house fabrication and machining backed by industry partners, from tube bending and welding to precision machined parts.
# "How we build it": the steps every car goes through, in order.
buildProcess:
  - name: Design
    description: Every season starts from a clean sheet. Each subteam designs its systems in CAD and backs every decision with analysis.
  - name: Review
    description: Initial and engineering design reviews pressure-test every part before design freeze locks the car.
  - name: Build
    description: We cut, bend, weld, and machine the car in house and with industry partners until it stands as a rolling chassis.
  - name: Test
    description: From first drive on, we log data, break things on purpose, and fix them before the competition does.
  - name: Compete
    description: The car debuts at our spring Rollout, then races endurance, acceleration, hill climb, and design events against 100+ universities.
