- season: 2024–25
  event: Baja SAE Maryland
  location: Maryland
  overall: 31
  fieldSize: 98
  improvement: First podium in team history
  highlights:
    - 3rd Acceleration
    - 16th Hill Climb
    - 17th Maneuverability
    - 18th Design
  story:
    - The 40-student 2024–25 team set out to finish top 10 in Acceleration and designed the car around it, benchmarking against the winning times of the previous three years. To cut rotating mass, it replaced the driveshaft and bevel gears with a chain-driven, selectable four-wheel drive and swapped the limited-slip front differential for one-way bearings, saving 11 pounds. A custom two-stage gearbox, titanium upper control arms, and a Raspberry Pi logging CVT data in testing rounded it out.
    - "It worked. Car #124 took 3rd in Acceleration at Baja SAE Maryland, the program's first event podium, and scored 605 points, the most in team history, to finish 31st of 98. It also finished inside the top 20 in Hill Climb, Maneuverability, and Design, and completed 33 laps of the four-hour endurance race."
