- season: 2017–18
  event: Baja SAE Kansas
  location: Kansas
  overall: 33
  fieldSize: 95
  improvement: Our first Baja SAE competition
  highlights:
    - 7th Maneuverability
    - 25th Acceleration
    - 27th Endurance
  story:
    - The team formed in spring 2017 out of the Texas A&M Racing Apprentices program, with 27 sophomores and juniors, two faculty advisors, and no class attached. Families and local supporters funded most of that first car.
    - At Baja SAE Kansas in May 2018 the team finished 33rd of 95 against programs with two decades of experience, and placed 7th in Maneuverability. One of the design judges sought the team out afterward to congratulate them.
