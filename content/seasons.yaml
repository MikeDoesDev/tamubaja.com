- season: 2020–21
  event: Virtual Knowledge Event
  location: Online
  overall: 8
  fieldSize: 156
  improvement: First four-wheel-drive car to race
  highlights:
    - 8th overall, Baja SAE Arizona Validation Event
    - 20th overall, Baja SAE Louisville Validation Event
    - 3rd among non-capstone projects at Texas A&M
  story:
    - The 2020–21 team finished the four-wheel-drive car the pandemic had interrupted, and raced for the first time as Fightin' Texas Aggie Motorsports. At SAE's Virtual Knowledge Event the team placed 8th of 156, still the best finish in program history.
    - "When in-person racing returned, the same car ran both of SAE's validation events, finishing 8th in Arizona as #68 and 20th in Louisville a month later as #99. To spend testing time on reliability instead of tuning, it paired its Briggs & Stratton engine with a manual gearbox in place of the usual CVT."
    - This season also welcomed the team's first class of apprentices.
