  improvement: First four-wheel-drive design
  highlights:
    - Team-record overall finish at the time
  story:
    - Midway through design, SAE announced rules that rewarded four-wheel drive ahead of making it required. As only a third-year team, we saw a chance to level the field against schools with decades of two-wheel-drive experience, voted unanimously to make the switch, and started the car over.
    - The team built suspension models, tolerance calculators, and acceleration simulations through the fall, then welded and machined nearly every day of the spring semester. The chassis was fully welded and the suspension was going on when COVID-19 closed the shops and SAE canceled in-person racing.
    - The team competed in the virtual Baja SAE Louisville event instead, presenting its designs to industry judges, and finished 16th of 100, the best result in program history at the time.
