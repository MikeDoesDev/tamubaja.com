- season: 2023–24
  event: Baja SAE Williamsport
  location: Williamsport, Pennsylvania
  overall: 18
  fieldSize: 106
  highlights:
    - 4th Design
    - 10th Hill Climb
    - 16th Cost
    - 17th Acceleration
  story:
    - The 39-student 2023–24 team designed for performance and simplicity, benchmarking every target against the top 10 cars from previous competitions and keeping joints, parts, and fasteners simple so the car could spend more time testing. The four-wheel-drive car split torque 50/50 through a custom double-reduction gearbox, on a chromoly frame stiffer than its targets.
    - "Car #56, in retro sunset stripes, gave the program its best in-person finish yet, 18th of 106 at Baja SAE Williamsport. The judges placed its design 4th, the team's best design result, and on the track it climbed to 10th in Hill Climb and ran 30 laps of endurance."
