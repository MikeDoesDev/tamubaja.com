# Competition history. Add the newest season at the top.
# overall: the overall placing as a number, or null if there was no overall result.
# fieldSize (optional): how many teams were ranked, so the site can say "31st of 98".
# highlights: awards and event finishes, written like "4th Design".
# improvement (optional): the one biggest step forward that season, e.g. "First podium".
#   Leave it out and the site shows how many places the team climbed overall, when it did.
# story (optional): a few short paragraphs about the season, shown on that season's car page.
#   Any line with a car number like "#54" must be wrapped in double quotes, or everything after
#   the # is dropped as a comment.
# specs and leads (optional) show on that season's car page. Don't add specs for a car that is still competing.
#   specs:
#     - label: Engine
#       value: Briggs & Stratton 10 HP
#   leads:
#     - name: Jane Doe
#       role: Chief Engineer
# Only add results the team has confirmed. Results below come from the official Baja SAE results
# (bajasae.net) and the team's earlier website.
- season: 2025–26
  event: Baja SAE Oregon
  location: Oregon
  overall: 34
  fieldSize: 76
  improvement: Best Business Presentation score in team history
  highlights:
    - 17th Design
    - 19th Cost
    - 20th Business Presentation
  story:
    - "Car #51 was designed and built from a clean sheet, with a custom gearbox and in-house hubs. Sponsors made parts we couldn't make alone, supplying gear hobbing and splining, tube bending and coping, material, and sensors."
