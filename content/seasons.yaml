  improvement: Best Business Presentation score in team history
  highlights:
    - 17th Design
    - 19th Cost
    - 20th Business Presentation
  story:
    - The program's ninth car was built by 44 students from 13 majors. Before designing anything, the team studied the previous eight competitions, found that acceleration scores most consistently and can be simulated with confidence, and set targets of top 3 in Acceleration, top 5 in Maneuverability, and top 10 in Endurance.
    - "A new Controls subteam designed an electronic CVT: a ball-screw-actuated primary run by a Teensy microcontroller, paired with a Gaged secondary, and tuned on an engine dynamometer the team built itself. Car #51 went to rear-wheel drive and used titanium axles and suspension links, aluminum trailing arms, dual-rate coilovers, and a custom two-stage gearbox and in-house hubs. Sponsors made parts we couldn't make alone, supplying gear hobbing and splining, tube bending and coping, material, and sensors."
    - At Baja SAE Oregon the static events were the team's strongest in years, with top-20 finishes in Design, Cost, and Business Presentation and the best Business score the program has ever earned. In endurance the car was disqualified after rolling over too many times, with three laps logged.
