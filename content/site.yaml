mission:
  - Texas A&M Baja SAE is the Aggie collegiate engineering team in College Station, Texas, that designs, builds, and races a brand-new off-road vehicle every year, then takes it to international Baja SAE competition against more than 100 universities.
  - Founded as a development program for Texas A&M's Formula team, we find high-potential undergraduates and give them the tools, mentorship, and hands-on experience to make an immediate impact in the automotive industry.
