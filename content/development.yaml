# Development page: our new-member development program and how to join.
intro: Texas A&M Baja started as a development path for the Formula team. New members start with Texas A&M SAE's development program, which takes students with zero shop experience and gets them ready to design, make, and race real parts.
# The path a new member takes, from first meeting to the car.
phases:
  - name: Get in the shop
    description: Shop safety, hand and power tools, and the training needed to work in the Fischer Engineering Design Center.
  - name: Learn the tools
    description: CAD, drawings, and basic analysis, taught by current members using real parts from past cars.
  - name: Build a starter project
    description: Small teams design and make a real component with a mentor from a subteam.
  - name: Join a subteam
    description: Pick the subteam that fits, from chassis to business, and start contributing to the next car.
