# paths: the two ways to join, shown side by side.
paths:
  - name: Team member
    who: For students ready to take on a part of the car or the business side.
    description: Join a subteam and own real work on the next car, from design and analysis through manufacturing and testing.
    points:
      - "Subteams: chassis, suspension, powertrain, controls, manufacturing, and business"
      - Design, build, and test parts that race at competition
      - Present your work at the team's design reviews
  - name: Apprentice
    who: For new students, including freshmen, with little or no shop or design experience.
    description: Apprentices work alongside a subteam and learn the tools and the car before taking on parts of their own. Engineering and business apprentice spots are open.
    points:
      - Paired with a subteam and its lead from day one
      - Learn CAD, analysis, and shop skills on real parts
      - "Many of today's leads started as apprentices, including our chief engineer"
# applySteps: how applying works, in order.
applySteps:
  - Create an account on Pitcrew, Texas A&M SAE's recruiting portal.
  - Choose Texas A&M Baja and pick team member or apprentice (engineering or business).
  - Submit your application and watch your email for next steps, including an interview.
applyUrl: https://apply.tamusae.org/
